name: Publish marketplace plugin
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and package
        run: |
          set -eu
          node --check main.js
          node --check paste.js
          python3 -m py_compile install.py update_titles.py
          id=$(node -p 'require("./package.json").logseq.id')
          version=$(node -p 'require("./package.json").version')
          test "$RELEASE_TAG" = "v$version"
          mkdir -p "$id/docs"
          cp -R vendor package.json LICENSE README.md index.html main.js paste.js codex-logo.png icon.svg install.py update_titles.py THIRD-PARTY.md "$id/"
          cp docs/*.png "$id/docs/"
          zip -qr "$id.zip" "$id"
          unzip -tq "$id.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(node -p 'require("./package.json").logseq.id')
          gh release create "$RELEASE_TAG" "$id.zip" --verify-tag --latest --title "$RELEASE_TAG · Codex Chat Links" --notes-file "docs/$RELEASE_TAG.md"
